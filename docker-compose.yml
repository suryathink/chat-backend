services:
  mysql:
    image: mysql:8.4
    container_name: chat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_app
      MYSQL_USER: chat
      MYSQL_PASSWORD: chat
    command: --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uchat", "-pchat"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
